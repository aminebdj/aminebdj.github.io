<!-- ===================== Compact news feed ===================== -->
<section class="home-section">
  <h2 class="home-h2">News</h2>
  <ul class="news-list">
    {% for item in site.data.news %}
      <li class="news-item">
        <span class="news-date">{{ item.date }}</span>
        <span class="news-text">{{ item.html }}{% if item.tag %} <span class="badge-honor">{{ item.tag }}</span>{% endif %}</span>
      </li>
    {% endfor %}
  </ul>
</section>
